services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: silicon-sandwiches-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"     # Protocolo AMQP 0-9-1
      - "15672:15672"   # Consola de Gestão Web (login/pass: guest / guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:

